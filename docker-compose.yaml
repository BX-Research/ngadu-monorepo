services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${DEV_DB_USER:-ngadu}
      POSTGRES_PASSWORD: ${DEV_DB_PASSWORD:-change-me-local-only}
      POSTGRES_DB: ${DEV_DB_NAME:-ngadu_dev}
    ports:
      - '127.0.0.1:${DEV_DB_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  storage:
    image: chrislusf/seaweedfs:4.51
    command: ['mini', '-dir=/data', '-ip=127.0.0.1', '-ip.bind=0.0.0.0']
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-ngadu-local}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-change-me-local-storage-only}
      S3_BUCKET: ${S3_BUCKET:-ngadu-dev}
    ports:
      - '127.0.0.1:${S3_PORT:-9000}:8333'
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'wget -S -O /dev/null http://127.0.0.1:8333/ 2>&1 | grep -q "403 Forbidden"']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

volumes:
  postgres-data:
  seaweedfs-data:
